<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninja Link">
<title>Ninja Link</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0A0908; --card:#151413; --line:#2A2724; --text:#EEEBE6; --sub:#8D8983; --gold:#CDA663; --gold2:#E9CF91;
          --goldgrad: linear-gradient(180deg,#FBEFCB 0%,#E3C47F 22%,#B08A45 48%,#7E5E2A 56%,#A9843F 78%,#E9CF91 100%); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: max(28px, env(safe-area-inset-top)) 16px 28px; gap: 16px; }
  .brand { font-weight: 900; font-size: 26px; letter-spacing: .5px; margin-top: 8px; }
  .brand b { background: var(--goldgrad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .pc { display: flex; gap: 10px; align-items: center; }
  .pc .name { flex: 1; font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: inherit; background: #1C1A18; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
  button.gold { background: var(--goldgrad); color: #14100A; border-color: var(--gold2); font-weight: 800; }
  button.small { padding: 6px 10px; font-size: 13px; color: var(--sub); }
  .muted { color: var(--sub); font-size: 14px; }
  .err { color: #FF8A80; font-size: 14px; }
</style>
</head>
<body>
  <div class="brand">NINJA <b>LINK</b></div>
  <div id="out" class="card"><div class="muted">Loading…</div></div>
  <button id="installBtn" class="gold" style="display:none;max-width:420px;width:100%">📲 Install Ninja Link on this phone</button>
  <div id="installTip" class="muted" style="max-width:420px;text-align:center"></div>
<script>
"use strict";
// Finds a paired PC: asks the lookup service where it is right now, then opens it with this phone's key.
// Keys stay in the # of the address (never sent to a server) and in this phone's storage.
const SUPABASE = "https://yzarcmrxrwjptzyzmnsg.supabase.co";
const KEY = "sb_publishable_KD2zQFafRW5vFeIj8cZQ_A_mUawA6aQ";
const out = document.getElementById("out");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function load() { try { return JSON.parse(localStorage.getItem("ninjaLinkPCs") || "[]"); } catch { return []; } }
function save(list) { localStorage.setItem("ninjaLinkPCs", JSON.stringify(list)); }
function newKey() {
  const b = new Uint8Array(32); crypto.getRandomValues(b);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function where(pc) {
  const r = await fetch(SUPABASE + "/rest/v1/rpc/link_lookup", {
    method: "POST", headers: { "Content-Type": "application/json", apikey: KEY },
    body: JSON.stringify({ p_device: pc.d, p_lookup: pc.k }),
  });
  if (!r.ok) throw new Error("The lookup service didn't answer (" + r.status + ").");
  const rows = await r.json();
  return rows[0] || null;
}

async function open(pc, pairCode) {
  out.innerHTML = `<div class="muted">Finding <b>${esc(pc.n)}</b>…</div>`;
  let found;
  try { found = await where(pc); } catch (e) { return list(e.message); }
  if (!found) return list(`${esc(pc.n)} isn't known any more. Pair this phone again.`);
  const name = esc(found.name || pc.n), seen = new Date(found.updated_at);
  // The PC checks in every 5 minutes while Ninja Link runs, and says goodbye when Windows shuts down.
  const running = found.online && Date.now() - seen.getTime() < STALE_MS;
  if (running && found.url) {
    location.replace(found.url + "/#" + (pairCode ? "pair=" + encodeURIComponent(pairCode) + "&" : "") + "t=" + encodeURIComponent(pc.t));
    return;
  }
  if (running) return list(`<b>${name}</b> is on, but remote access is switched off in Ninja Link.<br><span class="muted">Switch it on at the PC (Ninja Link → Remote access).</span>`);
  offline(pc, found, name, seen);
}

const STALE_MS = 12 * 60 * 1000;

function wakeLinks(found) {
  try { return JSON.parse(found.wake_links || "[]").filter(w => /^https:\/\//.test(w.url)); } catch { return []; }
}

// The PC is off (or Ninja Link stopped checking in): offer the user's turn-on links (they power-cycle its smart plug).
function offline(pc, found, name, seen) {
  const links = wakeLinks(found);
  const i = load().findIndex(x => x.d === pc.d);
  out.innerHTML = `<div style="font-weight:800;font-size:18px">🖥 ${name} is off</div>
    <div class="muted">Last seen ${seen.toLocaleString()}.</div>` +
    (links.length
      ? links.map((w, j) => `<button class="gold" onclick="wake(${i},${j})">⏻ Turn on with ${esc(w.name)}</button>`).join("") +
        `<div class="muted">Switches the PC's smart plug off and on. It takes a minute or two to start.</div>`
      : `<div class="muted">To turn it on from here, set up a smart plug and add its link in Ninja Link on the PC (Turn on from your phone).</div>`) +
    `<button onclick="go(${i})">Check again</button>`;
  window._found = found;
}

window.wake = async (i, j) => {
  const pc = load()[i], w = wakeLinks(window._found)[j];
  if (!confirm(`Turn on ${pc.n} with ${w.name}?\n\nOnly do this if the PC is really off: it switches the PC's power off and on.`)) return;
  out.innerHTML = `<div class="muted">Asking ${esc(w.name)} to turn on ${esc(pc.n)}…</div>`;
  try { await fetch(w.url, { method: "GET", mode: "no-cors", cache: "no-store", referrerPolicy: "no-referrer" }); }
  catch (e) { out.innerHTML = `<div class="err">Couldn't reach ${esc(w.name)}: ${esc(e.message)}</div><button onclick="go(${i})">Back</button>`; return; }
  waitForPc(pc, 0);
};

// After turning it on: look every 10 seconds for up to 4 minutes, then open it.
async function waitForPc(pc, n) {
  out.innerHTML = `<div style="font-weight:800;font-size:18px">Turning on ${esc(pc.n)}…</div>
    <div class="muted">Waiting for Windows and Ninja Link to start (${n * 10} s). This page opens it as soon as it's ready.</div>`;
  let found = null;
  try { found = await where(pc); } catch {}
  if (found && found.online && found.url && Date.now() - new Date(found.updated_at).getTime() < STALE_MS) return open(pc);
  if (n >= 24) return list(`${esc(pc.n)} hasn't come on yet. If it's still off, check the plug and the BIOS setting, then try again.`);
  setTimeout(() => waitForPc(pc, n + 1), 10000);
}

function list(problem) {
  const pcs = load();
  if (!pcs.length) {
    out.innerHTML = `<div style="font-weight:800;font-size:18px">No PCs yet</div><div class="muted">On your PC, open Ninja Link → Pair a phone, and scan the QR code with this phone's camera.</div>`;
    return;
  }
  out.innerHTML = (problem ? `<div class="err">${problem}</div>` : "") + pcs.map((pc, i) => `
    <div class="pc"><div class="name">🖥 ${esc(pc.n)}</div>
      <button class="small" onclick="forget(${i})">Remove</button>
      <button class="gold" onclick="go(${i})">Open</button></div>`).join("");
}
window.go = i => open(load()[i]);
window.forget = i => {
  const pcs = load();
  if (!confirm(`Remove ${pcs[i].n} from this phone? You'd need to pair again.`)) return;
  pcs.splice(i, 1); save(pcs); list();
};

// ── Install as an app (home screen icon, full screen) ──
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!standalone) {
  const tip = document.getElementById("installTip");
  tip.textContent = /iPhone|iPad/.test(navigator.userAgent)
    ? "Install it: tap Share (the square with the arrow) → Add to Home Screen. Then open Ninja Link from its icon."
    : "Install it: tap ⋮ (top right) → Add to Home screen / Install app. Then open Ninja Link from its icon.";
  let prompt = null;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); prompt = e;
    const b = document.getElementById("installBtn"); b.style.display = "";
    b.onclick = async () => { prompt.prompt(); await prompt.userChoice; b.style.display = "none"; };
  });
}

(function start() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (location.hash) history.replaceState(null, "", location.pathname);
  const pcs = load();
  if (h.get("d") && h.get("k") && h.get("p")) {
    // Just scanned the QR on the PC: remember this PC (with a key made on this phone), then pair.
    let pc = pcs.find(x => x.d === h.get("d"));
    if (!pc) { pc = { d: h.get("d"), k: h.get("k"), n: h.get("n") || "My PC", t: newKey() }; pcs.push(pc); }
    else { pc.k = h.get("k"); pc.n = h.get("n") || pc.n; }
    save(pcs);
    return open(pc, h.get("p"));
  }
  if (pcs.length === 1) return open(pcs[0]);
  list();
})();
</script>
</body>
</html>
